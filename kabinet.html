<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кабінет країни</title>
<style>
:root{--bg:#dfe9e6;--fg:#12302b;--card:#fff;--mut:#6c7f7b;--ac:#1f8a7a;--bd:#c9d8d4;--bad:#c62828;--th:#1f8a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e2623;--fg:#e6f2ef;--card:#17332f;--mut:#8fa9a4;--ac:#47c1ae;--bd:#2a4a45;--bad:#ff7b72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e2623;--fg:#e6f2ef;--card:#17332f;--mut:#8fa9a4;--ac:#47c1ae;--bd:#2a4a45;--bad:#ff7b72;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;padding:12px}
.g{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}@media(max-width:760px){.g{grid-template-columns:1fr}}
.c{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid var(--bd)}
.hero{border-radius:14px;padding:14px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,var(--th),#000a);display:flex;gap:12px;align-items:center;justify-content:space-between}
.hero h2{margin:0;font-size:24px}.fl{font-size:44px;line-height:1}
h4{margin:12px 0 4px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0}.m{color:var(--mut);font-size:12px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}.k>div{border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}
.k .sh{box-shadow:0 0 14px 1px #3b82f6;border-color:#3b82f6}.k .dd{filter:grayscale(1);opacity:.7}.ill{font-size:42px;line-height:1.1;transition:transform .3s}.k>div:hover .ill{transform:scale(1.12)}
.bar{height:6px;border-radius:3px;background:var(--bd);margin:4px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--th)}
.k label,.k .row{text-align:left}
button,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}button{cursor:pointer}
button.p{background:var(--th);color:#fff;border-color:var(--th);font-weight:600}
.big{font-size:30px;font-weight:800;color:var(--th)}.er{color:var(--bad)}.dead{color:var(--mut);text-decoration:line-through}
.hd{padding:6px 10px;color:#fff;font-weight:700}.ob{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--card)}.ob .row{padding:4px 10px}
.ch{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:2px 10px;margin:2px 2px 0 0;cursor:pointer}.ch.on{background:var(--th);color:#fff;border-color:var(--th)}
.ev{border-left:5px solid var(--mut);background:var(--bg);border-radius:8px;padding:6px 10px;margin:6px 0}
.ev.hit{border-color:#e0392b;animation:sk .5s}.ev.shield{border-color:#3b82f6;animation:gl 1.8s ease-in-out infinite}.ev.aa{border-color:#2e9e5b}.ev.sanc{border-color:#e08a1b}.ev.nuke{border-color:#6b21a8}.ev.intel{border-color:#0891b2}
@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes gl{50%{box-shadow:0 0 14px 2px #3b82f6}}
.stamp{display:inline-block;border:3px solid var(--th);color:var(--th);font-weight:800;letter-spacing:.1em;padding:4px 12px;border-radius:8px;transform:rotate(-6deg);animation:st .5s ease-out;margin:6px 0}
@keyframes st{from{transform:scale(2.6) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
.news{padding:4px 0;border-bottom:1px dashed var(--bd)}.sp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
</style></head><body>
<div class="c"><b>Код стану від ведучого</b><div class="m" style="margin:4px 0">Ведучий надсилає його вам у Telegram після кожного раунду. Вставте сюди повністю.</div><textarea id="in" rows="2" style="width:100%" placeholder="S1:..."></textarea><div class="row"><button class="p" onclick="load()">Завантажити</button><span id="msg" class="m"></span></div></div>
<div id="st" class="m" style="margin:0 0 8px"></div>
<div id="app"></div>
<script>
let S=null,O=null,SB='',pv=null;
const TH={'НІМЕЧЧИНА':['🇩🇪','#d4a017'],'КНДР':['🇰🇵','#c62828'],'НІГЕРІЯ':['🇳🇬','#2e8b57'],'МАДАГАСКАР':['🇲🇬','#e8743b'],'ІРАН':['🇮🇷','#2f9e6a'],'КОЛУМБІЯ':['🇨🇴','#d1a400'],'УКРАЇНА':['🇺🇦','#2b6fd6'],'США':['🇺🇸','#3b5bdb'],'КИТАЙ':['🇨🇳','#d9363e'],'АЗЕРБАЙДЖАН':['🇦🇿','#1fa3a3']};
const th=n=>{if(TH[n])return TH[n];let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return['🏳️','hsl('+h+',55%,42%)']};
const ce=l=>l<=0?'🏚️':l<=25?'🏡':l<=50?'🏘️':l<=75?'🏙️':'🌆';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
const newO=()=>({d:[0,0,0,0],s:[0,0,0,0],nk:0,e:0,a:0,rk:0,sa:[],st:[],i:''});
function sv(){SB='';try{localStorage.setItem('wp_o',JSON.stringify({k:S.n+'|'+S.r,O}))}catch(e){}}
function load(t){const el=document.getElementById('in'),m=document.getElementById('msg');t=(typeof t==='string'?t:el.value).trim();try{if(t.slice(0,3)!=='S1:')throw 0;S=JSON.parse(decodeURIComponent(escape(atob(t.slice(3)))));O=newO();SB='';pv=null;try{const q=JSON.parse(localStorage.getItem('wp_o'));if(q&&q.k===S.n+'|'+S.r)O=q.O;localStorage.setItem('wp_s',t)}catch(e){}el.value='';m.textContent='Завантажено: '+S.n+', раунд '+S.r;render()}catch(e){m.textContent='Невірний код. Скопіюйте його повністю, від S1:'}}
function cost(){const p=S.p;return O.d.filter(x=>x).length*p.d+O.s.filter(x=>x).length*p.s+(O.nk&&!S.nuke?p.nk:0)+(O.e?p.e:0)+(O.a&&!S.aa?p.a:0)+O.rk*p.r+(O.i?p.i:0)}
function T(k,i){O[k][i]=O[k][i]?0:1;sv();render()}
function V(k,v){O[k]=v;sv();render()}
function arr(k,v){const a=O[k],x=a.indexOf(v);x<0?a.push(v):a.splice(x,1);sv();render()}
async function send(){const q={n:S.n,r:S.r,d:O.d,s:O.s,nk:O.nk,e:O.e,a:O.a,rk:O.rk,sa:O.sa,st:O.st,i:O.i},code='O1:'+btoa(unescape(encodeURIComponent(JSON.stringify(q))));if(DB&&TK){try{const r=await fetch(DB+'/o/'+TK+'.json',{method:'PUT',body:JSON.stringify(code)});if(!r.ok)throw 0;SB=`<div class='stamp'>НАКАЗИ ВІДПРАВЛЕНО</div><div class='m'>Ведучий отримає їх автоматично. Можна змінити накази й відправити ще раз.</div>`}catch(e){SB=`<div class='er'>⚠ Не вдалося відправити. Перевірте інтернет і спробуйте ще раз.</div>`}}else SB=`<div class='stamp'>КОД ГОТОВИЙ</div><div class='m'>Надішліть код ведучому.</div><textarea id='out' rows='3' readonly style='width:100%;margin-top:6px'>${code}</textarea>`;render();const o=document.getElementById('out');if(o){o.select();try{document.execCommand('copy')}catch(e){}}}
function tween(el,a,b){if(a===null||a===b){el.textContent=b+'$';return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/450);el.textContent=Math.round(a+(b-a)*k)+'$';if(k<1)requestAnimationFrame(f)})(t0)}
function spark(v,col,lab,u){v=v.filter(x=>x!==null&&x!==undefined);if(!v.length)return`<div class='m'>${lab}: даних ще немає</div>`;const W=140,H=48,mx=Math.max(...v,1),mn=Math.min(...v,0),X=i=>6+(W-12)*(v.length>1?i/(v.length-1):.5),Y=x=>H-6-(H-12)*(x-mn)/((mx-mn)||1);return`<div><div class='m'>${lab}: <b>${v[v.length-1]}${u}</b></div><svg viewBox='0 0 ${W} ${H}' style='width:100%'><polyline fill='none' stroke='${col}' stroke-width='2' points='${v.map((x,i)=>X(i)+','+Y(x)).join(' ')}'/>${v.map((x,i)=>`<circle cx='${X(i)}' cy='${Y(x)}' r='2.5' fill='${col}'/>`).join('')}</svg></div>`}
const EV=[[/ЯДЕРН/,'nuke','☢️'],[/щит/,'shield','🛡'],[/^💥/,'hit','💥'],[/^🛰/,'aa','🛰'],[/^🚫/,'sanc','🚫'],[/^🔍/,'intel','🔍']];
const evc=x=>{for(const[r,c,i]of EV)if(r.test(x))return[c,i];return['own','🎯']};
function render(){const A=document.getElementById('app');if(!S){A.innerHTML='';return}
const[fl,col]=th(S.n);document.documentElement.style.setProperty('--th',col);
const K=cost(),rest=S.bal-K,p=S.p,er=[];if(K>S.bal)er.push('Не вистачає грошей');if(O.st.length>S.mis)er.push('Ракет бракує: цілей '+O.st.length+', є '+S.mis);if(O.rk>0&&!S.nuke)er.push('Ракети потребують ядерної технології');
const L0=S.c.reduce((a,z)=>a+z.l,0),L1=L0+S.c.reduce((a,z,k)=>a+(z.l>0&&z.l<p.m&&O.d[k]?Math.min(p.m,z.l+p.g)-z.l:0),0),na=(O.nk&&!S.nuke?1:0)+O.rk+O.st.length,eco2=Math.max(p.em||10,Math.min(100,S.eco+(O.e?(p.eg||30):0))-(p.ed||3)*na),f1=Math.round(L1*p.inc*eco2/100),f2=Math.round(f1*(1-p.sc/100));
const cb=(on,h,dis,lab)=>`<label class='row'><span>${lab}</span><input type='checkbox'${on?' checked':''}${dis?' disabled':''} onchange='${h}'></label>`;
const hit=l=>Math.round(l*(1-p.h/100)),shl=l=>Math.round(l*(1-p.sl/100));
const H=S.h||[];
let L=`<div class='hero'><div><h2>${esc(S.n)}</h2><div style='opacity:.85'>Раунд ${S.r} з ${S.rounds} · екологія країни <b>${S.eco}%</b></div></div><div class='fl'>${fl}</div></div>
<div class='c'><div class='row'><span class='m'>Доступний бюджет</span><span class='big' id='bud'>${rest}$</span></div>
<div class='m'>Прогноз доходу: <b>${f1}$</b>, якщо вас ніхто не обкладе санкціями й міста вціліють (<b>${f2}$</b> при санкціях). Екологія країни після ваших наказів: <b>${eco2}%</b> (зараз ${S.eco}%), без урахування дій інших країн.</div>
<div class='m'>Дохід за останній раунд: ${S.inc}$ · 🚀 ${S.mis} · ППО: ${S.aa?'є':'немає'} · ☢️ технологія: ${S.nuke?'є':'немає'}</div>
<h4>Міста</h4><div class='k'>`+S.c.map((z,k)=>{const sh=z.s||O.s[k],dd=z.l<=0;return`<div class='${sh&&!dd?'sh':''}${dd?' dd':''}'><div class='ill'>${ce(z.l)}</div><b${dd?" class='dead'":''}>${esc(z.n)}</b><div class='bar'><i style='width:${Math.max(0,z.l)}%'></i></div><div class='m'>${dd?'знищено':z.l+'%'+(z.s?' 🛡':'')}</div>${dd?'':`<div class='m' title='Якщо вдарять'>${sh?'🛡 удар → '+shl(z.l):'удар → '+hit(z.l)}%</div>`}${cb(O.d[k],`T("d",${k})`,dd||z.l>=p.m,`Розвинути <span class='m'>(${p.d}$)</span>`)}${cb(O.s[k],`T("s",${k})`,dd||z.s,`Щит <span class='m'>(${p.s}$)</span>`)}</div>`}).join('')+`</div>
<h4>Дії країни</h4>${S.nuke?`<div class='row'><span>Ядерна технологія</span><b>розроблена</b></div>`:cb(O.nk,`V("nk",${O.nk?0:1})`,0,`Розробити ядерну технологію <span class='m'>(${p.nk}$)</span>`)}${S.aa?`<div class='row'><span>ППО</span><b>стоїть</b></div>`:cb(O.a,`V("a",${O.a?0:1})`,0,`Поставити ППО <span class='m'>(${p.a}$)</span>`)}${cb(O.e,`V("e",${O.e?0:1})`,0,`Вкласти в екологію <span class='m'>(${p.e}$)</span>`)}
<div class='row'><span>Створити ракети <span class='m'>(${p.r}$ шт., з наступного раунду${S.nuke?'':'; потрібна ядерна технологія'})</span></span><select${S.nuke?'':' disabled'} onchange='V("rk",+this.value)'>${Array.from({length:(p.mr===undefined?3:p.mr)+1},(_,n)=>n).map(n=>`<option${O.rk===n?' selected':''}>${n}</option>`).join('')}</select></div>
<div class='row'><span>Розвідка <span class='m'>(${p.i}$)</span></span><select onchange='V("i",this.value)'><option value=''>—</option>${S.o.map(t=>`<option${O.i===t.n?' selected':''}>${esc(t.n)}</option>`).join('')}</select></div>
<h4>Санкції (0$)</h4><div>${S.o.map(t=>`<span class='ch${O.sa.includes(t.n)?' on':''}' onclick='arr("sa",${JSON.stringify(t.n).replace(/"/g,'&quot;')})'>${esc(t.n)}</span>`).join('')}</div>
<h4>Підсумок наказів</h4><div class='row'><span>Витрати</span><b>${K}$</b></div><div class='row'><span>Залишок</span><b>${rest}$</b></div><div class='row'><span>Цілей для ударів</span><b>${O.st.length} з ${S.mis}</b></div>${er.map(e=>`<div class='er'>⚠ ${e}</div>`).join('')}
<div style='margin-top:10px'><button class='p' onclick='send()'${er.length?' disabled':''}>Відправити накази (отримати код)</button></div>${SB}</div>`;
if(S.ev&&S.ev.length)L+=`<div class='c'><b>Що сталося з вами</b>`+S.ev.map(x=>{const[c,i]=evc(x);return`<div class='ev ${c}'>${i} ${esc(x.replace(/^\S+ /,''))}</div>`}).join('')+`</div>`;
L+=`<div class='c'><b>Ваш шлях</b><div class='sp' style='margin-top:6px'>${spark(H.map(h=>h.b),col,'Баланс','$')}${spark(H.map(h=>h.i),'#2e9e5b','Дохід','$')}${spark(H.map(h=>h.e),'#0891b2','Екологія','%')}</div></div>
<div class='c'><b>Особисті записи</b><textarea rows='3' style='width:100%;margin-top:6px' placeholder='Нотатки: кому довіряєте, плани…' oninput='try{localStorage.setItem("wp_n_"+S.n,this.value)}catch(e){}'>${esc((()=>{try{return localStorage.getItem('wp_n_'+S.n)||''}catch(e){return''}})())}</textarea></div>`;
const R=(false?`<div class='c'><b>🌍 Новини світу</b>${S.wn.map(x=>`<div class='news'>${esc(x)}</div>`).join('')}</div>`:'')+S.o.map(t=>{const c=th(t.n);return`<div class='ob'><div class='hd' style='background:${c[1]}'>${c[0]} ${esc(t.n)}</div>`+t.c.map(z=>`<div class='row'><span${z.x?" class='dead'":''}>${z.x?'🏚️':'🏙️'} ${esc(z.n)}</span>${z.x?`<span class='m'>знищено</span>`:`<label class='m'>Бомбити <input type='checkbox'${O.st.includes(t.n+'|'+z.n)?' checked':''} onchange='arr("st",${JSON.stringify(t.n+'|'+z.n).replace(/"/g,'&quot;')})'></label>`}</div>`).join('')+`</div>`}).join('');
A.innerHTML=`<div class='g'><div>${L}</div><div>${R}</div></div>`;
tween(document.getElementById('bud'),pv,rest);pv=rest}
try{const t=localStorage.getItem('wp_s');if(t)load(t)}catch(e){}
function fromHash(){const h=location.hash.slice(1);if(h.length>40&&h[0]==='c'){let b=h.slice(1).replace(/-a/g,'+').replace(/-b/g,'/');while(b.length%4)b+='=';load('S1:'+b)}}

const Q=new URLSearchParams(location.search),DB=(Q.get('d')||'').replace(/\/+$/,''),TK=Q.get('t');let LAST='';
function setOn(ok){const e=document.getElementById('st');if(e&&ok!==null)e.textContent=ok?'🟢 Онлайн: стан оновлюється автоматично':'🔴 Немає зв’язку, пробую ще раз…'}
async function pull(){if(!DB||!TK)return;try{const r=await fetch(DB+'/s/'+TK+'.json'),v=await r.json();setOn(true);if(typeof v==='string'&&v!==LAST){LAST=v;load(v)}else if(v===null&&!S)document.getElementById('st').textContent='Очікуємо, поки ведучий опублікує стан…'}catch(e){setOn(false)}}
if(DB&&TK){const f=document.querySelector('.c');if(f)f.style.display='none';setInterval(pull,5000);pull()}
</script></body></html>
