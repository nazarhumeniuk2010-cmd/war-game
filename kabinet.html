<div class="c"><b>Код стану від ведучого</b><div class="m" style="margin:4px 0">Ведучий надсилає його вам після кожного раунду. Вставте сюди повністю.</div><textarea id="in" rows="2" style="width:100%" placeholder="S1:..."></textarea><div class="row"><button class="p" onclick="load()">Завантажити</button><span id="msg" class="m"></span></div></div>

<script>

function applyPh(){document.querySelectorAll('.ph[data-n]').forEach(e=>{const u=PH[e.dataset.n];if(u)e.style.cssText=phs(u)});applyBgi()}
function getPh(n){if(n in PH||PQ.has(n))return;PQ.add(n);fetch('https://uk.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(n.replace(/ /g,'_'))).then(r=>r.json()).then(j=>{PH[n]=(j.type!=='disambiguation'&&j.thumbnail&&j.thumbnail.source)||'';try{localStorage.setItem('wp_ph',JSON.stringify(PH))}catch(e){}applyPh()}).catch(()=>{})}
function sv(){SB='';try{localStorage.setItem('wp_o',JSON.stringify({k:S.n+'|'+S.r,O}))}catch(e){}}
function diff(a,b){if(!a||a.n!==b.n)return null;const f={d:[],s:[],h:[]};b.c.forEach((z,k)=>{const p=a.c[k];if(!p)return;if(p.l>0&&z.l<=0)f.d.push(k);else if(z.l<p.l)f.h.push(k);if(p.s&&!z.s)f.s.push(k)});return f}
function load(t){const el=document.getElementById('in'),m=document.getElementById('msg');t=(typeof t==='string'?t:el.value).trim();try{if(t.slice(0,3)!=='S1:')throw 0;const N=JSON.parse(decodeURIComponent(escape(atob(t.slice(3)))));const OLD=S;FX=diff(S,N);S=N;TXC(OLD,N);O=newO();SB='';pv=null;try{const q=JSON.parse(localStorage.getItem('wp_o'));if(q&&q.k===S.n+'|'+S.r)O=q.O;localStorage.setItem('wp_s',t)}catch(e){}el.value='';m.textContent='Завантажено: '+S.n+', раунд '+S.r;render()}catch(e){m.textContent='Невірний код. Скопіюйте його повністю, від S1:'}}
function cost(){const p=S.p;return O.d.filter(x=>x).length*p.d+O.s.filter(x=>x).length*p.s+(O.nk&&!S.nuke?p.nk:0)+(O.e?p.e:0)+(O.a&&!S.aa?p.a:0)+O.rk*p.r+(O.i?p.i:0)}
function T(k,i){O[k][i]=O[k][i]?0:1;sv();render()}

async function send(){const q={n:S.n,r:S.r,d:O.d,s:O.s,nk:O.nk,e:O.e,a:O.a,rk:O.rk,sa:O.sa,st:O.st,i:O.i},code='O1:'+btoa(unescape(encodeURIComponent(JSON.stringify(q))));if(DB&&TK){try{const r=await fetch(DB+'/o/'+TK+'.json',{method:'PUT',body:JSON.stringify(code)});if(!r.ok)throw 0;SB=`<div class='stamp'>НАКАЗИ ВІДПРАВЛЕНО</div><div class='m'>Ведучий отримає їх автоматично. Можна змінити накази й відправити ще раз.</div>`}catch(e){SB=`<div class='er'>⚠ Не вдалося відправити. Перевірте інтернет і спробуйте ще раз.</div>`}}else SB=`<div class='stamp'>КОД ГОТОВИЙ</div><div class='m'>Надішліть код ведучому.</div><textarea id='out' rows='3' readonly style='width:100%;margin-top:6px'>${code}</textarea>`;render();const o=document.getElementById('out');if(o){o.select();try{document.execCommand('copy')}catch(e){}}}
function tween(el,a,b){if(!el)return;if(a===null||a===b){el.textContent=b+'$';return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/450);el.textContent=Math.round(a+(b-a)*k)+'$';if(k<1)requestAnimationFrame(f)})(t0)}
function spark(v,col,lab,u){v=v.filter(x=>x!==null&&x!==undefined);if(!v.length)return`<div class='m'>${lab}: даних ще немає</div>`;const W=140,H=48,mx=Math.max(...v,1),mn=Math.min(...v,0),X=i=>6+(W-12)*(v.length>1?i/(v.length-1):.5),Y=x=>H-6-(H-12)*(x-mn)/((mx-mn)||1);return`<div><div class='m'>${lab}: <b>${v[v.length-1]}${u}</b></div><svg viewBox='0 0 ${W} ${H}' style='width:100%'><polyline fill='none' stroke='${col}' stroke-width='2' points='${v.map((x,i)=>X(i)+','+Y(x)).join(' ')}'/>${v.map((x,i)=>`<circle cx='${X(i)}' cy='${Y(x)}' r='2.5' fill='${col}'/>`).join('')}</svg></div>`}
const EV=[[/ЯДЕРН/,'nuke','☢️'],[/щит/,'shield','🛡'],[/^💥/,'hit','💥'],[/^🛰/,'aa','🛰'],[/^🚫/,'sanc','🚫'],[/^🔍/,'intel','🔍']];
const evc=x=>{for(const[r,c,i]of EV)if(r.test(x))return[c,i];return['own','🎯']};
const SKY=a=>a>=75?['#5cb8ff','#d6f0ff']:a>=50?['#8fb4cc','#efe3b8']:a>=25?['#a87c52','#d9a066']:['#7a1f1a','#c85a2e'];
function mapR(M){const n=M.c.length,cols=Math.min(3,n),rows=Math.ceil(n/cols),cw=200,chh=165,W=cols*cw,H=rows*chh,avg=M.ae,sk=SKY(avg),hs=new Set(M.h),ss=new Set(M.s),as=new Set(M.a);
let g=`<defs><linearGradient id='sk' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${sk[0]}'/><stop offset='1' stop-color='${sk[1]}'/></linearGradient></defs><rect width='${W}' height='${H}' rx='14' fill='url(#sk)'/><circle cx='${W-36}' cy='30' r='16' fill='#ffe08a' opacity='${Math.max(0,(avg-40)/60).toFixed(2)}'/>`;
for(let q=0;q<3;q++)g+=`<ellipse class='sm' cx='${W*(.2+.3*q)}' cy='${H*(.25+.25*q)}' rx='90' ry='24' fill='#4a3a2a' opacity='${Math.max(0,(100-avg)/150).toFixed(2)}' style='animation-delay:${-q*3}s'/>`;
M.c.forEach((c,i)=>{const x=(i%cols)*cw+10,y=Math.floor(i/cols)*chh+10,w=cw-20,h=chh-20,k=PAL[i%PAL.length];g+=`<rect x='${x}' y='${y}' width='${w}' height='${h}' rx='22' stroke-width='2' class='${as.has(c.n)?'aaf':''}' style='fill:#fff;fill-opacity:.22;stroke:${k}'/><rect x='${x}' y='${y}' width='${w}' height='${h}' rx='22' fill='#3a2a1a' opacity='${Math.max(0,(100-c.e)/170).toFixed(2)}'/><text x='${x+w/2}' y='${y+22}' font-size='13' font-weight='700' text-anchor='middle' fill='#111'>${esc(c.n)}</text>`;

function bg(ae){const s=SKY(ae===undefined?80:ae),b=document.body.style;b.setProperty('--s1',s[0]);b.setProperty('--s2',s[1]);const e=ae===undefined||ae>=50?'✨':ae>=25?'💨':'🔥';document.querySelectorAll('.pt').forEach(x=>x.textContent=e)}

if(S.fin){A.innerHTML=`<div style='max-width:560px;margin:auto'>${hero}<div class='c' style='text-align:center'><div style='font-size:46px'>🏁</div><b style='font-size:20px'>Гру завершено!</b><div class='m' style='margin-top:6px'>Підсумки, рейтинг і нагороди покаже ведучий.</div></div></div>`;FX=null;return}
const K=cost(),rest=S.bal-K,p=S.p,er=[];if(K>S.bal)er.push('Не вистачає грошей');if(O.st.length>S.mis)er.push('Ракет бракує: цілей '+O.st.length+', є '+S.mis);if(O.rk>0&&!S.nuke)er.push('Ракети потребують ядерної технології');
const L0=S.c.reduce((a,z)=>a+z.l,0),L1=L0+S.c.reduce((a,z,k)=>a+(z.l>0&&z.l<p.m&&O.d[k]?Math.min(p.m,z.l+p.g)-z.l:0),0),na=(O.nk&&!S.nuke?1:0)+O.rk+O.st.length,eco2=Math.max(p.em||10,Math.min(100,S.eco+(O.e?(p.eg||30):0))-(p.ed||3)*na),f1=Math.round(L1*p.inc*eco2/100),f2=Math.round(f1*(1-p.sc/100));

const hit=l=>Math.round(l*(1-p.h/100)),shl=l=>Math.round(l*(1-p.sl/100)),H=S.h||[],f=FX||{d:[],s:[],h:[]};
let L=hero+`<div class='c'><div class='row'><span class='m'>Доступний бюджет</span><span class='big' id='bud'>${rest}$</span></div>

/* ===== ПЕРЕКАЗИ ГРОШЕЙ ІНШИМ КРАЇНАМ ===== */
var TQ=[],TXT='',TXA='',TXM='',TXN='',TXNT=0,txSig='',TXB=0;
function trKey(x){return x.f+'|'+x.t+'|'+x.s}
function TXC(a,b){if(!a||!b||a.n!==b.n)return;if(a.r!==b.r){TXN='';return}const p=(a.tr||[]).map(trKey);(b.tr||[]).forEach(x=>{const i=p.indexOf(trKey(x));if(i>=0)p.splice(i,1);else if(x.t===b.n){TXN='💰 Вам надійшло '+x.s+'$ від '+x.f;TXNT=Date.now()}})}
function avail(){return Math.max(0,S.bal-cost())}
function renderTx(){
 const E=document.getElementById('tx');if(!E)return;
 const on=!!(DB&&TK),tr=(S&&S.tr)||[];
 if(!S||S.fin||(!on&&!tr.length)){if(txSig){E.innerHTML='';txSig=''}return}
 if(TXN&&Date.now()-TXNT>20000)TXN='';
 const now=Date.now(),qs=TQ.filter(x=>x.r===S.r&&(!x.st||(x.st==='no'&&now-x.ts<180000)));
 const sig=[S.n,S.r,S.bal,on,JSON.stringify(tr),qs.map(x=>x.id+(x.st||'')).join(),TXN,TXM,S.o.map(t=>t.n).join()].join('|');
 if(sig!==txSig){txSig=sig;

  +(TXN?`<div class='ev aa'>${esc(TXN)}</div>`:'')

  <div style='display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px'><select id='txto' onchange='TXT=this.value' style='flex:1 1 100%'>${S.o.map(t=>`<option${TXT===t.n?' selected':''}>${esc(t.n)}</option>`).join('')}</select>
  <input id='txa' type='number' min='1' step='1' placeholder='Сума, $' value='${esc(TXA)}' oninput='TXA=this.value' style='flex:1;min-width:0;font:inherit;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)'>
  <button class='p' onclick='sendTx()'>Переказати</button></div>`+(TXM?`<div class='m'>${esc(TXM)}</div>`:''):'')
  +qs.map(x=>x.st==='no'?`<div class='ev hit'>❌ ${x.a}$ → ${esc(x.to)}: ${esc(x.why||'відхилено')}</div>`:`<div class='ev'>⏳ ${x.a}$ → ${esc(x.to)}: очікує підтвердження</div>`).join('')
  +tr.slice(-8).reverse().map(x=>x.t===S.n?`<div class='ev aa'>⬇ Від <b>${esc(x.f)}</b>: +${x.s}$</div>`:`<div class='ev sanc'>⬆ Для <b>${esc(x.t)}</b>: −${x.s}$</div>`).join('')+`</div>`;
 }
 const av=document.getElementById('txav');if(av)av.textContent=avail()+'$';
}
async function sendTx(){
 if(TXB||!S||!DB||!TK)return;
 const to=document.getElementById('txto').value,a=Math.floor(+document.getElementById('txa').value),say=m=>{TXM=m;txSig='';renderTx()};
 if(!to||!(a>0))return say('Оберіть країну й введіть суму');
 if(a>avail())return say('Не вистачає грошей (можна переказати '+avail()+'$)');
 TXB=1;
 const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),x={id,to,a,r:S.r,ts:Date.now()};
 try{const r=await fetch(DB+'/t/'+TK+'/'+id+'.json',{method:'PUT',body:JSON.stringify(x)});if(!r.ok)throw r.status;
  TQ.push(x);TXA='';TXM='';txSig='';renderTx();pullTr()}
 catch(e){say('⚠ Не вдалося відправити'+(typeof e==='number'?' (код '+e+', база не дозволяє запис у /t)':' (немає зв’язку з базою)')+'.')}
 finally{TXB=0}
}
async function pullTr(){
 if(!DB||!TK)return;
 try{const r=await fetch(DB+'/t/'+TK+'.json'),v=await r.json();
  TQ=Object.values(v||{}).filter(x=>x&&x.id&&x.ts).sort((p,q)=>p.ts-q.ts).slice(-20);renderTx()}catch(e){}
}
setInterval(pullTr,2500);setInterval(renderTx,1000);pullTr();
