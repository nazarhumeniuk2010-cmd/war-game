<h4>Дії країни</h4>${S.nuke?`<div class='row'><span>Ядерна технологія</span><b>розроблена</b></div>`:cb(O.nk,`V("nk",${O.nk?0:1})`,0,`Розробити ядерну технологію <span class='m'>(${p.nk}$)</span>`)}${S.aa?`<div class='row'><span>ППО</span><b>стоїть</b></div>`:cb(O.a,`V("a",${O.a?0:1})`,0,`Поставити ППО <span class='m'>(${p.a}$)</span>`)}${cb(O.e,`V("e",${O.e?0:1})`,0,`Вкласти в екологію <span class='m'>(${p.e}$)</span>`)}
<div class='row'><span>Створити ракети <span class='m'>(${p.r}$ шт., з наступного раунду${S.nuke?'':'; потрібна ядерна технологія'})</span></span><select${S.nuke?'':' disabled'} onchange='V("rk",+this.value)'>${Array.from({length:(p.mr===undefined?3:p.mr)+1},(_,n)=>n).map(n=>`<option${O.rk===n?' selected':''}>${n}</option>`).join('')}</select></div>
<div class='row'><span>Розвідка <span class='m'>(${p.i}$)</span></span><select onchange='V("i",this.value)'><option value=''>—</option>${S.o.map(t=>`<option${O.i===t.n?' selected':''}>${esc(t.n)}</option>`).join('')}</select></div>
<h4>Санкції (0$)</h4><div>${S.o.map(t=>`<span class='ch${O.sa.includes(t.n)?' on':''}' onclick='arr("sa",${JSON.stringify(t.n).replace(/"/g,'&quot;')})'>${esc(t.n)}</span>`).join('')}</div>
<h4>Підсумок наказів</h4><div class='row'><span>Витрати</span><b>${K}$</b></div><div class='row'><span>Залишок</span><b>${rest}$</b></div><div class='row'><span>Цілей для ударів</span><b>${O.st.length} з ${S.mis}</b></div>${er.map(e=>`<div class='er'>⚠ ${e}</div>`).join('')}
<div style='margin-top:10px'><button class='p' onclick='send()'${er.length?' disabled':''}>Відправити накази</button></div>${SB}</div>`;

const W=S.ae===undefined?'':`<div class='c'><b>🌍 Стан світу</b><div class='row'><span>Середня екологія</span><b>${S.ae}%</b></div><div class='bar'><i style='width:${S.ae}%;background:#2e9e5b'></i></div><div class='row'><span>Середній розвиток країн</span><b>${S.ad}%</b></div><div class='bar'><i style='width:${S.ad}%'></i></div><h4>Розвиток по країнах</h4>${(S.dv||[]).map(x=>`<div class='row'><span>${esc(x.n)}</span><span class='m'>${x.v}%</span></div><div class='bar'><i style='width:${x.v}%;background:${th(x.n)[1]}'></i></div>`).join('')}</div>`+(S.mp?`<div class='c'><b>🗺 Карта світу</b><div style='margin-top:6px'>${mapR(S.mp)}</div></div>`:'');

async function pull(){if(!DB||!TK)return;try{const r=await fetch(DB+'/s/'+TK+'.json'),v=await r.json();setOn(true);if(typeof v==='string'&&v!==LAST){LAST=v;load(v)}else if(v===null&&!S)document.getElementById('st').textContent='Очікуємо, поки ведучий опублікує стан…'}catch(e){setOn(false)}}

/* ===== ПЕРЕКАЗИ ГРОШЕЙ ІНШИМ КРАЇНАМ ===== */
var TQ=[],TXT='',TXA='',TXM='',TXN='',TXNT=0,txSig='',TXB=0;
function trKey(x){return x.f+'|'+x.t+'|'+x.s}
function TXC(a,b){if(!a||!b||a.n!==b.n)return;if(a.r!==b.r){TXN='';return}const p=(a.tr||[]).map(trKey);(b.tr||[]).forEach(x=>{const i=p.indexOf(trKey(x));if(i>=0)p.splice(i,1);else if(x.t===b.n){TXN='💰 Вам надійшло '+x.s+'$ від '+x.f;TXNT=Date.now()}})}
function avail(){return Math.max(0,S.bal-cost())}
function renderTx(){
 const E=document.getElementById('tx');if(!E)return;
 const on=!!(DB&&TK),tr=(S&&S.tr)||[];
 if(!S||S.fin||(!on&&!tr.length)){if(txSig){E.innerHTML='';txSig=''}return}

 if(sig!==txSig){txSig=sig;
  E.innerHTML=`<div class='c'><b>💸 Переказ грошей</b>`
  +(TXN?`<div class='ev aa'>${esc(TXN)}</div>`:'')

  <input id='txa' type='number' min='1' step='1' placeholder='Сума, $' value='${esc(TXA)}' oninput='TXA=this.value' style='flex:1;min-width:0;font:inherit;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)'>

  +tr.slice(-8).reverse().map(x=>x.t===S.n?`<div class='ev aa'>⬇ Від <b>${esc(x.f)}</b>: +${x.s}$</div>`:`<div class='ev sanc'>⬆ Для <b>${esc(x.t)}</b>: −${x.s}$</div>`).join('')+`</div>`;
 }
 const av=document.getElementById('txav');if(av)av.textContent=avail()+'$';
}
async function sendTx(){
 if(TXB||!S||!DB||!TK)return;
 const to=document.getElementById('txto').value,a=Math.floor(+document.getElementById('txa').value),say=m=>{TXM=m;txSig='';renderTx()};
 if(!to||!(a>0))return say('Оберіть країну й введіть суму');

 TXB=1;
 const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),x={id,to,a,r:S.r,ts:Date.now()};
 try{const r=await fetch(DB+'/t/'+TK+'/'+id+'.json',{method:'PUT',body:JSON.stringify(x)});if(!r.ok)throw r.status;
  TQ.push(x);TXA='';TXM='';txSig='';renderTx();pullTr()}
 catch(e){say('⚠ Не вдалося відправити'+(typeof e==='number'?' (код '+e+', база не дозволяє запис у /t)':' (немає зв’язку з базою)')+'.')}
 finally{TXB=0}
}
async function pullTr(){
 if(!DB||!TK)return;
 try{const r=await fetch(DB+'/t/'+TK+'.json'),v=await r.json();
  TQ=Object.values(v||{}).filter(x=>x&&x.id&&x.ts).sort((p,q)=>p.ts-q.ts).slice(-20);renderTx()}catch(e){}
}
setInterval(pullTr,2500);setInterval(renderTx,1000);pullTr();
